# fenrirealm-monitor — the sink every platform sender points at
# (iniznet/fenrirealm-tracker#145). Replaces the retired third-party server:
# one static Go binary, real SQLite volume (state SURVIVES restarts — the old
# sink was deliberately in-memory), UI bound to HOST LOOPBACK only.
#
# Deploy topology: the container joins dokploy-network so the backend stack's
# senders target it by service name — the exact defaults already committed to
# the backend compose:
#   MONITOR_LOG_SOCKET_URL=monitor:9913
#   PROFILER_ENDPOINT=http://backend@monitor:8000/api/profiler/store
#   SENTRY_LARAVEL_DSN=http://backend@monitor:8000/1
#   MONITOR_ENDPOINT=http://monitor:8000  (Laravel MonitorClient)
#   MONITOR_URL=http://monitor:8000       (SvelteKit reporter)
#
# UI: bound to HOST LOOPBACK ONLY (reach it via `ssh -L 8001:127.0.0.1:8001
# <node>`); it has no auth and must never ride Dokploy ingress. MONITOR_UI_PORT
# defaults to 8001 so it never collides with anything the old sink bound.
#
# Persistence: profiles + issues are only as useful as their history — the
# named volume is the retention policy (prune cap lives in the app).

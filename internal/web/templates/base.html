{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}fenrirealm-monitor{{end}}</title>
{{block "extrahead" .}}{{end}}
<style>
:root{
  --bg:#0b0e14; --panel:#12161f; --panel2:#171c26; --border:#232a35; --border2:#2e3744;
  --text:#dce3ec; --muted:#94a0b0; --faint:#7e8ba4;
  --accent:#4d9fff; --red:#ff6b5e; --yellow:#e3b341; --green:#4ade80; --purple:#b48cff;
  --mono:ui-monospace,'Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace;
  --sans:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--sans)}
::selection{background:#1e3a5f;color:#eaf2fc}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#2a323e;border-radius:5px;border:2px solid var(--bg)}

.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;padding:.6rem 1.25rem;background:rgba(13,16,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.brand{font:600 15px/1 var(--mono);color:var(--text);letter-spacing:-.02em}
.brand:hover{text-decoration:none}
.brand span{color:var(--faint);font-weight:400}
.topbar nav{display:flex;gap:.9rem;flex-wrap:wrap}
.topbar nav a{color:var(--muted);padding:.3rem .1rem;font-weight:500}
.topbar nav a:hover{color:var(--text);text-decoration:none}
.topbar nav a.active{color:var(--text);box-shadow:0 2px 0 var(--accent)}
.projects{margin-left:auto;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.projects .label{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.pill{font:12px/1 var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:.32rem .65rem}
.pill:hover{color:var(--text);border-color:var(--border2);text-decoration:none}
.pill.on{color:#0b0e14;background:var(--accent);border-color:var(--accent);font-weight:600}

.wrap{max-width:1200px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
h1{font-size:1.35rem;font-weight:650;letter-spacing:-.02em;margin:0 0 1rem}
h2{font-size:.85rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:2rem 0 .75rem}
.faint{color:var(--faint);font-size:12px}
.dim{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px}
.num{text-align:right;font-variant-numeric:tabular-nums}

.statstrip{display:flex;gap:2.25rem;flex-wrap:wrap;margin:.25rem 0 1.5rem}
.stat .v{font:600 1.5rem/1.15 var(--sans);font-variant-numeric:tabular-nums}
.stat .v.err{color:var(--red)}
.stat .k{color:var(--muted);font-size:12px}

table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}
th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:.45rem .75rem;border-bottom:1px solid var(--border2)}
td{padding:.55rem .75rem;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:hover{background:var(--panel)}
tr.resolved{opacity:.5}

.badge{display:inline-block;font:600 11px/1 var(--sans);padding:.28rem .5rem;border-radius:4px;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
.lvl-error,.lvl-critical,.lvl-alert,.lvl-emergency{color:var(--red);border-color:rgba(255,107,94,.35);background:rgba(255,107,94,.08)}
.lvl-warning{color:var(--yellow);border-color:rgba(227,179,65,.35);background:rgba(227,179,65,.08)}
.lvl-info{color:var(--accent);border-color:rgba(77,159,255,.35);background:rgba(77,159,255,.08)}
.lvl-debug{color:var(--faint)}
.badge.ok{color:var(--green);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08)}

button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border2);border-radius:6px;padding:.4rem .8rem;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
form.inline{display:inline}

pre{font:12.5px/1.55 var(--mono);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:.75rem .9rem;overflow-x:auto;margin:.5rem 0}

.filterbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.filterbar select,.filterbar input{font:13px var(--sans);color:var(--text);background:var(--panel2);border:1px solid var(--border2);border-radius:6px;padding:.35rem .5rem}
.filterbar input[type=search]{width:210px}
.filterbar input[name=channel]{width:130px}
.filterbar .label{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.08em}

.empty{color:var(--muted);padding:2.25rem 0;text-align:center}
.pager{margin:1rem 0}

.spark{vertical-align:middle}
.spark-line{fill:none;stroke:var(--accent);stroke-width:1.5}
.trend{display:block;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:.35rem;margin:.25rem 0}

.bar-row{display:grid;grid-template-columns:minmax(160px,300px) 1fr auto;gap:.75rem;align-items:center;padding:.3rem 0}
.track{position:relative;height:14px;background:var(--panel2);border-radius:4px;overflow:hidden}
.track .fill{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:4px}
.hot-fill{background:var(--purple)}
.wf-fill{background:var(--accent)}
.inline-bar{position:relative;width:90px;height:6px;background:var(--panel2);border-radius:3px;display:inline-block;vertical-align:middle;margin-right:.5rem;overflow:hidden}
.inline-bar .fill{position:absolute;top:0;bottom:0;left:0}

details.tn, .tn-leaf{margin-left:.9rem}
details.tn>summary, .tn-leaf{display:flex;gap:.6rem;align-items:center;padding:.14rem 0;list-style:none;cursor:pointer}
details.tn>summary::-webkit-details-marker{display:none}
details.tn>summary::before, .tn-leaf::before{content:"·";color:var(--faint,#667);flex:0 0 .6rem}
details.tn[open]>summary::before{content:"▾";color:var(--faint,#667)}
.tn-name{flex:0 1 46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn-bar{flex:1;min-width:70px;height:6px;background:var(--panel2);border-radius:3px;position:relative;overflow:hidden}
.tn-bar .fill{position:absolute;left:0;top:0;bottom:0}
.tn-num{flex:0 0 auto;min-width:70px;text-align:right}

.meta{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.actions{margin:1rem 0}
details.occ{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin:.6rem 0}
details.occ>summary{cursor:pointer;padding:.55rem .9rem;display:flex;gap:.75rem;align-items:baseline}
details.occ>summary:hover{background:var(--panel2);border-radius:10px}
details.occ[open]>summary{border-bottom:1px solid var(--border)}
details.occ .body{padding:.75rem .9rem}
summary::marker{color:var(--faint)}
.occ-title{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:grid;grid-template-columns:140px 1fr;gap:.3rem .9rem;font-size:13px}
.kv .k{color:var(--faint);font:11.5px/1.7 var(--mono)}
.kv .v{word-break:break-word;font-family:var(--mono);font-size:12.5px}
.stack{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;margin:.6rem 0}
.frame{display:flex;justify-content:space-between;gap:1rem;padding:.14rem 0;font-size:12.5px}
.frame .fn{color:var(--text);font-family:var(--mono);word-break:break-all}
.frame .loc{color:var(--faint);font-family:var(--mono);text-align:right;white-space:nowrap}
.raw-toggle{color:var(--faint);cursor:pointer;font-size:12px}

@media (max-width:720px){
  .topbar{gap:.6rem}
  .statstrip{gap:1.25rem}
  .bar-row{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">fenrirealm<span>-monitor</span></a>
  <nav>
    <a href="/?project={{.Project}}"{{if eq .Page "dashboard"}} class="active"{{end}}>Dashboard</a>
    <a href="/issues?project={{.Project}}"{{if eq .Page "issues"}} class="active"{{end}}>Issues</a>
    <a href="/logs?project={{.Project}}"{{if eq .Page "logs"}} class="active"{{end}}>Logs</a>
    <a href="/profiles?project={{.Project}}"{{if eq .Page "profiles"}} class="active"{{end}}>Profiles</a>
    <a href="/slowest?project={{.Project}}"{{if eq .Page "slowest"}} class="active"{{end}}>Slowest</a>
  </nav>
  {{with .Projects}}{{if gt (len .) 0}}
  <div class="projects">
    <span class="label">project</span>
    <a href="/?project=" class="pill{{if eq $.Project ""}} on{{end}}">all</a>
    {{range .}}<a href="/?project={{.}}" class="pill{{if eq $.Project .}} on{{end}}">{{.}}</a>{{end}}
  </div>
  {{end}}{{end}}
</header>
<main class="wrap">
{{block "content" .}}{{end}}
</main>
</body>
</html>{{end}}

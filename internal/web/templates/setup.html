{{define "title"}}First-run setup — nightpost{{end}}
{{define "content"}}
<div class="auth-card">
<h1>Create the admin account</h1>
<p class="faint">This page closes for good once the account exists. Lost access later? Restart the container with <code class="mono">-reset-admin &lt;email&gt;</code> to get a fresh password.</p>
{{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}
<form method="post" action="/setup">
<label for="email">Email</label>
<input id="email" name="email" type="email" autocomplete="username" required>
<label for="password">Password (min 10 characters)</label>
<input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required>
<div class="auth-actions"><button type="submit">Create account</button></div>
</form>
</div>
{{end}}

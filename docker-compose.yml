# fenrirealm-monitor — the sink every platform sender points at
# (iniznet/fenrirealm-tracker#145). Replaces the retired third-party server:
# one static Go binary, real SQLite volume (state SURVIVES restarts — the old
# sink was deliberately in-memory), UI bound to HOST LOOPBACK only.
#
# Deploy topology: the container joins dokploy-network so the backend stack's
# senders target it by service name — the exact defaults already committed to
# the backend compose:
#   MONITOR_LOG_SOCKET_URL=monitor:9913
#   PROFILER_ENDPOINT=http://backend@monitor:8000/api/profiler/store
#   SENTRY_LARAVEL_DSN=http://backend@monitor:8000/1
#   MONITOR_ENDPOINT=http://monitor:8000  (Laravel MonitorClient)
#   MONITOR_URL=http://monitor:8000       (SvelteKit reporter)
#
# UI: NOT published to the host. It HAS auth (M4: HMAC session cookie +
# first-run /setup), but it is still not meant to ride Dokploy ingress — reach
# it through the docker network or ad hoc:
#   docker exec fenrirealm-monitor-production wget -qO- http://127.0.0.1:8000/up
# or run a one-off `docker compose up` override that adds a ports: mapping.
#
# Persistence: profiles + issues are only as useful as their history — the
# named volume is the retention policy. Inside the app the retention loop
# prunes occurrences older than the stored retention window (30 days by
# default), caps each issue's occurrence history at 50 and keeps EACH
# project's newest N profiles (M6.2 — a single global window let one noisy
# producer evict every other org's history).
#
# M6.3: the retention/prune/occurrence-cap/profile-window knobs live in the
# settings table and are edited at /settings. Any flags below are IMPORT-ONCE
# defaults — a value saved in the UI wins from then on.
#
# M4 (#157): the dashboard requires login (first visit = /setup). Set
# -session-secret, or point -session-secret-file at a mounted path and the key
# is generated once and PERSISTED there (0600) — an unset key is random per
# boot, so every deploy would silently log the admins out (M6.5).
# Optionally -alerts-config /path/alerts.json (mounted secret file; channels +
# rules).
# Lost admin: one-off `docker exec ... monitor -reset-admin <email>` writes a
# fresh password to <db-dir>/admin-reset.txt (0600) and names that path in the
# log; the password itself is never printed, because container stdout lands in
# the json-file log. Read it, then delete the file. Ingest keys rotate OR revoke at /keys (revoke falls
# back to unsigned legacy); unsigned legacy ingest still works until a key is
# issued.
#
# M6.5: per-project CORS — the browser allowlist moved onto the project row
# (edit it at /keys); -cors-origin only seeds a project whose row is empty.
#
# M6.10: today's ingest posture is safe only because nothing publishes a host
# port. The moment ingest sits behind a public ingress, set
# -require-ingest-keys (unsigned ingest then answers 401) and tune the coarse
# ceilings: -ingress-global-rate/-ingress-global-burst cover a distinct
# {project}-name flood, -max-auto-projects caps how many unsigned projects may
# be auto-provisioned at all, and -ingress-ip-rate sets the per-source-address
# leg (use 0 behind a reverse proxy, where every request shares the proxy
# address and the global ceiling is the real limit). X-Forwarded-For is
# deliberately NOT trusted.

services:
  monitor:
    build: .
    image: fenrirealm-monitor:latest
    container_name: fenrirealm-monitor-${APP_ENV:-production}
    restart: unless-stopped
    # NO host port publishing: every consumer (Monolog senders, Laravel
    # MonitorClient, SvelteKit reporter) reaches the service by name over
    # dokploy-network; host bindings would fight other projects' published
    # ports on the shared node (observed: 127.0.0.1:8001 already allocated).
    volumes:
      - monitor-data:/data
    environment:
      APP_ENV: ${APP_ENV:-production}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
    networks:
      - dokploy-network

volumes:
  monitor-data:

networks:
  dokploy-network:
    external: true
